trigger:
  batch: true
  branches:
    include:
      - main

pr: [main]

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

parameters:
  - name: publishPackage
    displayName: 🚀 Publish
    type: boolean
    default: false

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: gulp-electron
        buildSteps:
          - script: npm ci
        testPlatforms:
          - name: Linux
            nodeVersions: [24.x]
          - name: MacOS
            nodeVersions: [24.x]
          - name: Windows
            nodeVersions: [24.x]
        testSteps:
          - script: npm ci
          - task: AzureKeyVault@2
            displayName: "Azure Key Vault: Get Secrets"
            inputs:
              azureSubscription: vscode-oss-build-secrets
              KeyVaultName: vscode-oss-build-secrets
              SecretsFilter: github-token-code-oss
          - script: npm test
            env:
              GITHUB_TOKEN: "$(github-token-code-oss)"
        publishPackage: ${{ parameters.publishPackage }}